<!-- Firebase SDKs -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "COLE_AQUI", authDomain: "COLE_AQUI", projectId: "COLE_AQUI",
  storageBucket: "COLE_AQUI", messagingSenderId: "COLE_AQUI", appId: "COLE_AQUI"
};
const USANDO_FIREBASE = firebaseConfig.apiKey !== "COLE_AQUI";
let db;
if (USANDO_FIREBASE) {
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  onSnapshot(collection(db, "ativos"), (snapshot) => {
    window.ativos = [];
    snapshot.forEach(d => window.ativos.push({ ...d.data(), id: d.id }));
    window.ativos.sort((a,b) => (a.codigo||"").localeCompare(b.codigo||""));
    window.renderView();
    setStatus("🟢 Conectado ao Firebase", "#22c55e");
  });
}
window.salvarAtivoFB = async (obj) => { if (!USANDO_FIREBASE) return; await setDoc(doc(db,"ativos",String(obj.id)), obj); };
window.excluirAtivoFB = async (id) => { if (!USANDO_FIREBASE) return; await deleteDoc(doc(db,"ativos",String(id))); };
window.USANDO_FIREBASE = USANDO_FIREBASE;
if (!USANDO_FIREBASE) setStatus("⚠️ Modo local — configure o Firebase para sincronizar", "#f59e0b");
function setStatus(m,c){ const el=document.getElementById("statusBar"); if(el){el.textContent=m;el.style.color=c;} }
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f0f4fb;color:#1e293b;font-family:'DM Sans','Segoe UI',sans-serif;min-height:100vh;}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:#dce6f5;}::-webkit-scrollbar-thumb{background:#7a9cc8;border-radius:3px;}
.card{background:#ffffff;border:1px solid #d0ddf0;border-radius:12px;box-shadow:0 1px 4px rgba(40,60,120,.06);}
.btn-primary{background:linear-gradient(135deg,#1e3a8a,#283c78);color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;transition:opacity .2s;}
.btn-primary:hover{opacity:.85;}
.btn-green{background:linear-gradient(135deg,#059669,#047857);color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;}
.btn-green:hover{opacity:.85;}
.btn-orange{background:linear-gradient(135deg,#d97706,#b45309);color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;}
.btn-orange:hover{opacity:.85;}
.btn-ghost{background:transparent;color:#283c78;border:1px solid #c5d4ec;padding:8px 16px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;transition:all .2s;}
.btn-ghost:hover{background:#e8eef8;color:#1e293b;}
.btn-danger{background:transparent;color:#dc2626;border:1px solid #fca5a5;padding:8px 16px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;}
.btn-danger:hover{background:#fef2f2;}
.btn-sm{padding:5px 10px!important;font-size:11px!important;}
.nav-btn{background:transparent;border:none;color:#4a6080;padding:10px 16px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;transition:all .2s;white-space:nowrap;}
.nav-btn.active{background:#e8eef8;color:#1e293b;}
.nav-btn:hover:not(.active){color:#4a6080;}
.input{background:#e8eef8;border:1px solid #1e3a6e;border-radius:8px;color:#1e293b;padding:10px 14px;font-family:inherit;font-size:14px;width:100%;outline:none;transition:border-color .2s;}
.input:focus{border-color:#2952a3;}
.input option{background:#e8eef8;}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;}
.tr-hover:hover{background:#e8eef8!important;}
.progress-bar{height:6px;background:#dce8f5;border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;transition:width .5s;}
.section-title{font-size:12px;font-weight:600;color:#4a6080;text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px;}
.label{display:block;font-size:12px;font-weight:600;color:#4a6080;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeIn .3s ease;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;}
.grid-5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
#header{border-bottom:1px solid #1e2538;padding:0 24px;position:sticky;top:0;background:#f0f4fb;z-index:100;}
#header-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:76px;gap:16px;}
#main{max-width:1400px;margin:0 auto;padding:28px 24px;}
.mono{font-family:'DM Mono',monospace;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:500;display:flex;align-items:center;justify-content:center;padding:24px;}
.modal-box{max-width:960px;width:100%;max-height:92vh;overflow:auto;padding:32px;}
table{width:100%;border-collapse:collapse;}
th{padding:12px 12px;text-align:left;font-size:11px;font-weight:600;color:#6080a0;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #c5d4ec;}
td{padding:11px 12px;border-bottom:1px solid #e2eaf5;font-size:13px;}
.toast{position:fixed;bottom:24px;right:24px;background:#e8eef8;border:1px solid #c5d4ec;border-radius:10px;padding:14px 20px;font-size:13px;z-index:1000;opacity:0;transition:opacity .3s;pointer-events:none;max-width:320px;}
.toast.show{opacity:1;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #3d4663;border-top-color:#2952a3;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{font-size:11px;color:#6080a0;margin-top:4px;}
.filtro-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center;}
.search-input{background:#e8eef8;border:1px solid #1e3a6e;border-radius:8px;color:#1e293b;padding:9px 14px 9px 36px;font-family:inherit;font-size:13px;outline:none;transition:border-color .2s;width:240px;}
.search-input:focus{border-color:#2952a3;}
.search-wrap{position:relative;}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#6080a0;font-size:14px;pointer-events:none;}
.chip-clear{background:#162040;border:none;color:#4a6080;padding:4px 10px;border-radius:20px;cursor:pointer;font-size:12px;font-family:inherit;}
.chip-clear:hover{background:#162040;color:#1e293b;}
</style>

function calcDep(a, ano, mes) {
  const dtInicio  = new Date(a.dataInicioDepreciacao || a.dataAquisicao);
  const ref       = new Date(ano, mes-1, 1);
  const meses     = Math.max(0,(ref.getFullYear()-dtInicio.getFullYear())*12+(ref.getMonth()-dtInicio.getMonth()));
  const vidaMeses = (a.vidaUtil||10)*12;
  const depreciavel = (a.valorAquisicao||0)-(a.valorResidual||0);
  const depMensal   = a.depMensalManual || (depreciavel/vidaMeses);
  const depAnterior = +(a.depAcumAnterior||0);
  const depCalc     = Math.min(depMensal*meses, depreciavel);
  const depAcum     = Math.min(depAnterior+depCalc, depreciavel);
  const liquido     = Math.max((a.valorAquisicao||0)-depAcum,(a.valorResidual||0));
  const perc        = depreciavel>0?(depAcum/depreciavel)*100:0;
  return {depMensal, depAcum, depAnterior, depCalc, liquido, perc, meses};
}

function gerarTabela(a) {
  const dt = new Date(a.dataInicioDepreciacao||a.dataAquisicao);
  const depreciavel = (a.valorAquisicao||0)-(a.valorResidual||0);
  const depMensal   = a.depMensalManual||(depreciavel/((a.vidaUtil||10)*12));
  const depAnterior = +(a.depAcumAnterior||0);
  return Array.from({length:(a.vidaUtil||10)+1},(_,i)=>{
    const ano      = dt.getFullYear()+i;
    const depCalc  = Math.min(depMensal*12*i, depreciavel);
    const depAnual = i===0?0:Math.min(depMensal*12, depreciavel-(depMensal*12*(i-1)));
    const depAcum  = Math.min(depAnterior+depCalc, depreciavel);
    const liquido  = Math.max((a.valorAquisicao||0)-depAcum,(a.valorResidual||0));
    return {ano, depAnual:i===0?0:depAnual, depAcum, liquido};
  });
}

async function persistirAtivo(obj) {
  if (window.USANDO_FIREBASE) { await window.salvarAtivoFB(obj); return; }
  const idx = window.ativos.findIndex(a=>a.id===obj.id);
  if(idx>=0) window.ativos[idx]=obj; else window.ativos.push(obj);

}
async function removerAtivo(id) {
  if (window.USANDO_FIREBASE) { await window.excluirAtivoFB(id); return; }

function onCategoria() {
  const c = document.getElementById("f_categoria").value;
  document.getElementById("f_vidaUtil").value = VIDA_UTIL[c]||10;

}

async function salvarAtivo() {
  const g = id => document.getElementById(id)?.value||"";
  const descricao=g("f_descricao"), valorAquisicao=g("f_valorAquisicao"), dataAquisicao=g("f_dataAquisicao");
  if(!descricao||!valorAquisicao||!dataAquisicao){ toast("Preencha os campos obrigatórios: Descrição, Valor e Data.",false); return; }
  const btn = document.getElementById("btnSalvar");
  btn.innerHTML='<span class="spinner"></span>Salvando...'; btn.disabled=true;
  const obj = {
    id: editandoId||String(Date.now()),
    codigo:g("f_codigo"), descricao, categoria:g("f_categoria"),
    valorAquisicao:+valorAquisicao, valorResidual:+g("f_valorResidual")||0,
    dataAquisicao, dataInicioDepreciacao:g("f_dataInicioDepreciacao")||null,
    depAcumAnterior:+g("f_depAcumAnterior")||0,
    vidaUtil:+g("f_vidaUtil")||10, taxaDepreciacao:+g("f_taxaDepreciacao")||10,
    status:g("f_status"), localizacao:g("f_localizacao"), responsavel:g("f_responsavel"),
    contaDebito:g("f_contaDebito"), contaCredito:g("f_contaCredito"),
    centroCusto:g("f_centroCusto"), historico:g("f_historico"),
    depMensalManual:+g("f_depMensalManual")||null,
    chaveNF:g("f_chaveNF"),
  };
  try {
    await persistirAtivo(obj);
    toast("✓ Ativo salvo com sucesso!");
    editandoId=null; navegarPara("lista");
  } catch(e) { toast("Erro ao salvar: "+e.message,false); btn.innerHTML=editandoId?"💾 Salvar Alterações":"✓ Cadastrar Ativo"; btn.disabled=false; }
}

function exportarRelatorioExcel() {
  const mes=getMes(), ano=getAno();
  const header = ["Código","Descrição","Categoria","Localização","Responsável","Chave NF-e","Data Aquisição","Início Depreciação","Valor Aquisição","Valor Residual","Dep. Acum. Anterior","Vida Útil (anos)","Taxa (%)","Dep. Mensal","Dep. Acumulada","Valor Líquido","% Depreciado","Status","Conta Débito","Conta Crédito","Centro de Custos","Histórico"];
  const rows = window.ativos.map(a=>{
    const d=calcDep(a,ano,mes);
    return [
      a.codigo, a.descricao, a.categoria, a.localizacao||"", a.responsavel||"", a.chaveNF||"",
      a.dataAquisicao, a.dataInicioDepreciacao||"",
      +(a.valorAquisicao||0), +(a.valorResidual||0), +(a.depAcumAnterior||0),
      +(a.vidaUtil||10), +(a.taxaDepreciacao||10),
      +d.depMensal.toFixed(2), +d.depAcum.toFixed(2), +d.liquido.toFixed(2), +d.perc.toFixed(2),
      a.status, a.contaDebito||"", a.contaCredito||"", a.centroCusto||"", a.historico||""
    ];
  });
  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
  // Larguras
  ws["!cols"] = [8,30,22,15,15,44,12,12,14,12,14,8,8,12,14,14,10,12,14,14,14,30].map(w=>({wch:w}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, `Relatório ${MESES_C[mes-1]}.${ano}`);
  XLSX.writeFile(wb, `Relatorio_Ativos_${MESES_C[mes-1]}_${ano}.xlsx`);
  toast("✓ Relatório exportado com sucesso!");
}

function editarAtivo(id) {
  const a = window.ativos.find(x=>x.id===id);
  window._form = {...a, depMensalManual:a.depMensalManual||"", chaveNF:a.chaveNF||""};
  editandoId = id; viewAtual = "form";
  document.querySelectorAll(".nav-btn").forEach((b,i)=>b.classList.toggle("active",i===2));
  renderView();
}

function copiarAtivo(id) {
  const a = window.ativos.find(x=>x.id===id);
  if(!a) return;
  const novoId = String(Date.now());
  window._form = {
    ...a,
    id: novoId,
    codigo: a.codigo ? a.codigo+"_COPIA" : "",
    descricao: a.descricao+" (Cópia)",
    depMensalManual: a.depMensalManual||"",
    chaveNF: a.chaveNF||"",
  };
  editandoId = null;
  viewAtual = "form";
  document.querySelectorAll(".nav-btn").forEach((b,i)=>b.classList.toggle("active",i===2));
  renderView();
  toast("📋 Ativo copiado — revise e salve o novo cadastro.");
}

async function excluirAtivo(id) {
  if(!confirm("Confirmar exclusão do ativo?")) return;
  try { await removerAtivo(id); toast("Ativo excluído."); navegarPara("lista"); }
  catch(e){ toast("Erro ao excluir: "+e.message,false); }
}

// ═══════════════════════════════════════════════════════════════
// MODAL LAYOUT → EXCEL
// ═══════════════════════════════════════════════════════════════
function gerarDadosLayout(mes, ano) {
  const dia     = new Date(ano, mes, 0).getDate();
  const dataFmt = `${String(dia).padStart(2,"0")}/${String(mes).padStart(2,"0")}/${ano}`;
  const lote    = `DEPREC ${String(mes).padStart(2,"0")}.${ano}`;
  const ref     = `REF. ${String(mes).padStart(2,"0")}/${ano}`;
  const linhas  = [];

  window.ativos.filter(a=>a.status==="Ativo").forEach(a=>{
    const dep  = calcDep(a,ano,mes);
    const depMensal = dep.depMensal;
    const chaveAloc = `${a.id}_${ano}_${String(mes).padStart(2,"0")}`;
    const aloc = (window.alocacoes||{})[chaveAloc];

    if (aloc && aloc.itens && aloc.itens.length > 0) {
      // Com rateio — gera uma linha por obra
      aloc.itens.forEach(item => {
        const valor = +(depMensal * item.perc / 100).toFixed(2);
        const contaD = item.contaDebito || a.contaDebito;
        const hist   = `${a.historico} ${ref} - ${item.obra}`;
        linhas.push({data:dataFmt,lote,conta:contaD,dc:"D",indicador:"N",valor,histPadrao:"",histComp:hist,ccus:item.ccus,proj:"",ativo:a.descricao,obra:item.obra,perc:item.perc});
        linhas.push({data:dataFmt,lote,conta:a.contaCredito,dc:"C",indicador:"N",valor,histPadrao:"",histComp:hist,ccus:"",proj:"",ativo:a.descricao,obra:item.obra,perc:item.perc});
      });
    } else {
      // Sem alocação — usa CCUS padrão do bem
      const hist = `${a.historico} ${ref}`;
      linhas.push({data:dataFmt,lote,conta:a.contaDebito,dc:"D",indicador:"N",valor:+depMensal.toFixed(2),histPadrao:"",histComp:hist,ccus:a.centroCusto||"",proj:"",ativo:a.descricao,obra:"—",perc:100});
      linhas.push({data:dataFmt,lote,conta:a.contaCredito,dc:"C",indicador:"N",valor:+depMensal.toFixed(2),histPadrao:"",histComp:hist,ccus:"",proj:"",ativo:a.descricao,obra:"—",perc:100});
    }
  });
  return {dataFmt,lote,ref,linhas};
}

function baixarLayoutExcel() {
  const mes=getMes(), ano=getAno();
  const {linhas,lote} = gerarDadosLayout(mes,ano);

  // Aba layout de importação
  const header = ["Data","Lote","Conta","Índice D/C","Indicador lcto","Valor","Cód. Hist. padrão","Hist. complementar","Cód. ccus","Cód. proj."];
  const cnpjRow = ["CNPJ", CNPJ];
  const dataRows = linhas.map(l=>[l.data,l.lote,l.conta,l.dc,l.indicador,l.valor,l.histPadrao,l.histComp,l.ccus,l.proj]);

  const ws = XLSX.utils.aoa_to_sheet([cnpjRow, header, ...dataRows]);
  ws["!cols"] = [12,18,16,8,10,12,12,50,14,10].map(w=>({wch:w}));

  // Aba resumo
  const mes2=getMes(), ano2=getAno();
  const resumoHeader = ["Código","Descrição","Conta Débito","Conta Crédito","CCUS","Dep. Mensal","Ref."];
  const resumoRows = window.ativos.filter(a=>a.status==="Ativo").map(a=>{
    const d=calcDep(a,ano2,mes2);
    return [a.codigo,a.descricao,a.contaDebito,a.contaCredito,a.centroCusto,+d.depMensal.toFixed(2),`${String(mes2).padStart(2,"0")}/${ano2}`];
  });
  const wsResumo = XLSX.utils.aoa_to_sheet([resumoHeader,...resumoRows]);
  wsResumo["!cols"]=[10,30,16,16,14,14,10].map(w=>({wch:w}));

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "LCTOS");
  XLSX.utils.book_append_sheet(wb, wsResumo, "Resumo");
  XLSX.writeFile(wb, `DEPREC_${String(mes).padStart(2,"0")}_${ano}.xlsx`);
  toast("✓ Layout exportado em Excel!");
}

function copiarLayout() {
  const mes=getMes(), ano=getAno();
  const {linhas,lote} = gerarDadosLayout(mes,ano);
  const header = `CNPJ\t${CNPJ}\nData\tLote\tConta\tÍndice D/C\tIndicador lcto\tValor\tCód. Hist. padrão\tHist. complementar\tCód. ccus\tCód. proj.`;
  const body = linhas.map(l=>`${l.data}\t${l.lote}\t${l.conta}\t${l.dc}\t${l.indicador}\t${fmtN(l.valor)}\t${l.histPadrao}\t${l.histComp}\t${l.ccus}\t${l.proj}`).join("\n");
  navigator.clipboard.writeText(header+"\n"+body).then(()=>{
    const btn=document.getElementById("btnCopiar"); btn.textContent="✓ Copiado!"; setTimeout(()=>btn.textContent="📋 Copiar TSV",2000);

}

// MÓDULO DE ALOCAÇÕES DE OBRAS

// Estrutura: alocacoes["{ativoId}_{ano}_{mes}"] = { ativoId, ano, mes, itens:[{obra,ccus,contaDebito,perc}] }
window.alocacoes = JSON.parse(localStorage.getItem("alocacoes_gest") || "{}");

function salvarAlocacoesLocal() {
  localStorage.setItem("alocacoes_gest", JSON.stringify(window.alocacoes));
}

function chaveAloc(ativoId, ano, mes) {
  return `${ativoId}_${ano}_${String(mes).padStart(2,"0")}`;
}

function getAloc(ativoId, ano, mes) {
  return window.alocacoes[chaveAloc(ativoId,ano,mes)] || null;
}

// ── RENDER PRINCIPAL ─────────────────────────────────────────────────────────
function renderAlocacoes() {
  const mes=getMes(), ano=getAno();
  const atAtivos = window.ativos.filter(a=>a.status==="Ativo");
  const mesLabel = `${MESES_C[mes-1]}/${ano}`;

  const rows = atAtivos.map(a => {
    const dep  = calcDep(a,ano,mes);
    const aloc = getAloc(a.id,ano,mes);
    const itens = aloc ? aloc.itens : [];
    const totalPerc = itens.reduce((s,i)=>s+(+i.perc||0),0);
    const semAloc   = itens.length===0;
    const percOk    = Math.abs(totalPerc-100)<0.01;

    let badge = semAloc
      ? `<span class="tag" style="background:#fef3c7;color:#92400e;">Padrão</span>`
      : percOk
        ? `<span class="tag" style="background:#d1fae5;color:#065f46;">Rateado ✓</span>`
        : `<span class="tag" style="background:#fee2e2;color:#991b1b;">⚠ ${totalPerc.toFixed(0)}%</span>`;

    const itensHtml = semAloc
      ? `<div style="font-size:12px;color:#6080a0;font-style:italic;">Usando CCUS padrão: ${a.centroCusto||"—"}</div>`
      : itens.map((it,idx)=>`
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap;">
            <span style="font-size:11px;background:#edf3fc;color:#283c78;padding:2px 8px;border-radius:12px;font-weight:600;">${it.perc}%</span>
            <span style="font-size:12px;font-weight:500;">${it.obra}</span>
            <span class="mono" style="font-size:11px;color:#4a6080;">CCUS: ${it.ccus}</span>
            <span class="mono" style="font-size:11px;color:#4a6080;">Cta D: ${it.contaDebito||a.contaDebito}</span>
            <span style="font-size:11px;color:#059669;font-family:'DM Mono',monospace;">${fmt(dep.depMensal*it.perc/100)}</span>
          </div>`).join("");

    return `
      <tr class="tr-hover" style="vertical-align:top;">
        <td style="padding:14px 12px;">
          <div style="font-weight:700;font-size:14px;color:#1e293b;">${a.descricao}</div>
          <div style="font-size:11px;color:#6080a0;margin-top:2px;">Cód. ${a.codigo||"—"}${a.localizacao?' · '+a.localizacao:''}</div>
          ${a.responsavel?`<div style="font-size:11px;color:#6080a0;">${a.responsavel}</div>`:''}
        </td>
        <td style="padding:14px 12px;">
          <div class="mono" style="font-size:12px;color:#059669;font-weight:700;">${fmt(dep.depMensal)}</div>
        </td>
        <td style="padding:14px 12px;">${badge}</td>
        <td style="padding:14px 12px;">${itensHtml}</td>
        <td style="padding:14px 12px;">
          <button class="btn-primary btn-sm" onclick="abrirModalAloc('${a.id}')">✏ Alocar</button>
          ${!semAloc?`<button class="btn-ghost btn-sm" style="margin-top:4px;" onclick="limparAloc('${a.id}')">↺ Padrão</button>`:''}
        </td>
      </tr>`;
  }).join("");

  // Resumo total
  let totDep=0, totAlocado=0;
  atAtivos.forEach(a=>{ const d=calcDep(a,ano,mes); totDep+=d.depMensal; const aloc=getAloc(a.id,ano,mes); if(aloc&&aloc.itens.length>0) totAlocado+=d.depMensal; });

  return `<div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
      <h2 style="font-size:24px;font-weight:700;">🏗️ Alocações de Obras — ${mesLabel}</h2>
      <div style="display:flex;gap:10px;">
        <button class="btn-orange" onclick="navegarPara('historico_aloc')">📋 Histórico</button>
        <button class="btn-green" onclick="abrirModalLayout()">⬇ Gerar Layout c/ Alocações</button>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px;">
      <div class="card" style="padding:18px;">
        <div style="font-size:11px;color:#4a6080;margin-bottom:4px;">Bens Ativos</div>
        <div style="font-size:22px;font-weight:700;">${atAtivos.length}</div>
      </div>
      <div class="card" style="padding:18px;">
        <div style="font-size:11px;color:#4a6080;margin-bottom:4px;">Dep. Total do Mês</div>
        <div style="font-size:22px;font-weight:700;font-family:'DM Mono',monospace;color:#283c78;">${fmt(totDep)}</div>
      </div>
      <div class="card" style="padding:18px;">
        <div style="font-size:11px;color:#4a6080;margin-bottom:4px;">Com Alocação de Obra</div>
        <div style="font-size:22px;font-weight:700;font-family:'DM Mono',monospace;color:#059669;">${fmt(totAlocado)}</div>
      </div>
    </div>

    <div class="card" style="overflow:auto;">
      <table>
        <thead><tr><th>Bem</th><th>Dep. Mensal</th><th>Status</th><th>Alocação ${mesLabel}</th><th>Ação</th></tr></thead>
        <tbody>${rows||'<tr><td colspan="5" style="padding:40px;text-align:center;color:#6080a0;">Nenhum ativo ativo.</td></tr>'}</tbody>
      </table>
    </div>
  </div>`;
}

// ── HISTÓRICO ────────────────────────────────────────────────────────────────
function renderHistoricoAloc() {
  const filtroId = window._histFiltroAtivo||"";
  const filtroMes = window._histFiltroMes||"";

  // Montar lista de todos os registros
  const registros = [];
  Object.entries(window.alocacoes).forEach(([chave, aloc])=>{
    if(!aloc||!aloc.itens) return;
    const ativo = window.ativos.find(a=>a.id===aloc.ativoId);
    registros.push({...aloc, ativo, chave});
  });
  registros.sort((a,b)=> `${b.ano}${String(b.mes).padStart(2,"0")}`.localeCompare(`${a.ano}${String(a.mes).padStart(2,"0")}`));

  const filtrados = registros.filter(r=>
    (!filtroId || r.ativoId===filtroId) &&
    (!filtroMes || `${r.ano}-${String(r.mes).padStart(2,"0")}`===filtroMes)
  );

  const ativoOpts = window.ativos.map(a=>`<option value="${a.id}"${filtroId===a.id?" selected":""}>${a.descricao}</option>`).join("");

  // Agrupar por mês para visão mensal
  const porMes = {};
  filtrados.forEach(r=>{
    const k=`${r.ano}-${String(r.mes).padStart(2,"0")}`;
    if(!porMes[k]) porMes[k]={label:`${MESES_C[r.mes-1]}/${r.ano}`,itens:[]};
    porMes[k].itens.push(r);
  });

  const mesesHtml = Object.entries(porMes).map(([k,grupo])=>{
    const rows = grupo.itens.map(r=>{
      const dep = r.ativo ? calcDep(r.ativo, r.ano, r.mes) : null;
      return r.itens.map(it=>`
        <tr class="tr-hover">
          <td style="font-size:12px;">${r.ativo?r.ativo.descricao:'—'}</td>
          <td style="font-size:12px;font-weight:600;">${it.obra}</td>
          <td class="mono" style="font-size:12px;color:#4a6080;">${it.ccus}</td>
          <td class="mono" style="font-size:12px;color:#4a6080;">${it.contaDebito||'padrão'}</td>
          <td style="font-size:12px;text-align:center;"><span style="background:#edf3fc;color:#283c78;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;">${it.perc}%</span></td>
          <td class="mono" style="font-size:12px;color:#059669;">${dep?fmt(dep.depMensal*it.perc/100):'—'}</td>
        </tr>`).join("");
    }).join("");

    return `
      <div style="margin-bottom:20px;">
        <div style="font-size:13px;font-weight:700;color:#283c78;margin-bottom:10px;padding:8px 14px;background:#edf3fc;border-radius:8px;">📅 ${grupo.label}</div>
        <div class="card" style="overflow:auto;">
          <table>
            <thead><tr><th>Bem</th><th>Obra</th><th>CCUS</th><th>Conta Débito</th><th>% Rateio</th><th>Valor Dep.</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  }).join("") || '<div style="padding:40px;text-align:center;color:#6080a0;">Nenhum apontamento encontrado.</div>';

  return `<div>
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:24px;flex-wrap:wrap;">
      <button class="btn-ghost" onclick="navegarPara('alocacoes')">← Voltar</button>
      <h2 style="font-size:22px;font-weight:700;">📋 Histórico de Alocações</h2>
      <button class="btn-green" onclick="exportarHistoricoExcel()">⬇ Exportar Excel</button>
    </div>
    <div class="card" style="padding:16px;margin-bottom:20px;">
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
        <select class="input" style="width:auto;font-size:13px;padding:9px 12px;" onchange="window._histFiltroAtivo=this.value;renderView()">
          <option value="">Todos os bens</option>${ativoOpts}
        </select>
        <input class="input" type="month" style="width:auto;font-size:13px;padding:9px 12px;" value="${filtroMes}" onchange="window._histFiltroMes=this.value;renderView()"/>
        ${filtroId||filtroMes?`<button class="chip-clear" onclick="window._histFiltroAtivo='';window._histFiltroMes='';renderView()">✕ Limpar</button>`:''}
        <span style="font-size:12px;color:#6080a0;margin-left:auto;">${filtrados.length} registro(s)</span>
      </div>
    </div>
    ${mesesHtml}
  </div>`;
}

      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;">
        <span style="color:#4a6080;">Total rateado</span>
        <span style="color:${barCor};font-weight:700;">${totalPerc.toFixed(1)}% ${totalPerc>100?'⚠ Excede 100%':totalPerc===100?'✓':'— faltam '+restante+'%'}</span>
      </div>
      <div class="progress-bar" style="height:8px;">
        <div class="progress-fill" style="width:${barraPerc}%;background:${barCor};"></div>
      </div>
    </div>

    ${itensHtml}

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;">
      <button class="btn-ghost" onclick="adicionarItemAloc()">+ Adicionar Obra</button>
      ${_alocItens.length===1?`<button class="btn-ghost" onclick="_alocItens[0].perc=100;renderModalAloc()">= Usar 100%</button>`:''}
      ${_alocItens.length>1?`<button class="btn-ghost" onclick="distribuirIgual()">⚖ Distribuir Igual</button>`:''}
    </div>

    <div style="border-top:1px solid #d0ddf0;padding-top:16px;margin-top:16px;display:flex;gap:10px;">
      <button class="btn-primary" onclick="salvarAloc()" ${totalPerc>100.01?'disabled style="opacity:.5;"':''}>💾 Salvar Alocação</button>
      <button class="btn-ghost" onclick="fecharModalAloc()">Cancelar</button>
    </div>`;
}

function adicionarItemAloc() {
  _alocItens.push({obra:"",ccus:"",contaDebito:"",perc:""});
  renderModalAloc();
}

function removerItemAloc(idx) {
  _alocItens.splice(idx,1);
  renderModalAloc();
}

function distribuirIgual() {
  const p = +(100/_alocItens.length).toFixed(2);
  _alocItens.forEach((it,i)=>{ it.perc = i===_alocItens.length-1 ? +(100-p*(i)).toFixed(2) : p; });
  renderModalAloc();
}

function salvarAloc() {
  const mes=getMes(), ano=getAno();
  const totalPerc = _alocItens.reduce((s,i)=>s+(+i.perc||0),0);
  if(totalPerc>100.01){ toast("Total do rateio excede 100%.",false); return; }
  if(_alocItens.some(i=>!i.obra||!i.ccus)){ toast("Preencha o nome da obra e o CCUS de todos os itens.",false); return; }
  const chave = chaveAloc(_alocAtivoId,ano,mes);
  window.alocacoes[chave] = { ativoId:_alocAtivoId, ano, mes, itens:_alocItens };
  salvarAlocacoesLocal();
  fecharModalAloc();
  toast("✓ Alocação salva!");
  renderView();
}

function limparAloc(ativoId) {
  if(!confirm("Remover alocação deste mês e voltar ao CCUS padrão?")) return;
  const mes=getMes(), ano=getAno();
  const chave = chaveAloc(ativoId,ano,mes);
  delete window.alocacoes[chave];
  salvarAlocacoesLocal();
  toast("Alocação removida — usando CCUS padrão.");
  renderView();
}

function exportarHistoricoExcel() {
  const header = ["Mês/Ano","Código","Bem","Obra / Projeto","CCUS","Conta Débito","% Rateio","Dep. Mensal Total","Dep. Alocada"];
  const rows = [];
  Object.values(window.alocacoes).forEach(aloc=>{
    const a = window.ativos.find(x=>x.id===aloc.ativoId);
    if(!a||!aloc.itens) return;
    const dep = calcDep(a,aloc.ano,aloc.mes);
    aloc.itens.forEach(it=>{
      rows.push([
        `${String(aloc.mes).padStart(2,"0")}/${aloc.ano}`,
        a.codigo||"", a.descricao,
        it.obra, it.ccus, it.contaDebito||a.contaDebito,
        +it.perc,
        +dep.depMensal.toFixed(2),
        +(dep.depMensal*it.perc/100).toFixed(2)
      ]);
    });
  });
  rows.sort((a,b)=>b[0].localeCompare(a[0]));
  const ws = XLSX.utils.aoa_to_sheet([header,...rows]);
  ws["!cols"]=[10,8,28,20,14,14,8,14,14].map(w=>({wch:w}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Histórico Alocações");
  XLSX.writeFile(wb,"Historico_Alocacoes.xlsx");
  toast("✓ Histórico exportado!");
}

function salvarContas()  { localStorage.setItem("contas_debito_gest", JSON.stringify(CONTAS_DEBITO)); }
function salvarCcusStorage() { localStorage.setItem("ccus_gest", JSON.stringify(CENTROS_CUSTO)); }

let _configTab = "contas"; // "contas" | "ccus"

function renderConfig() {
  return `<div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
      <h2 style="font-size:24px;font-weight:700;">⚙️ Configurações</h2>
    </div>

    <!-- Tabs -->
    <div style="display:flex;gap:4px;margin-bottom:20px;background:#f0f4fb;border-radius:10px;padding:4px;width:fit-content;">
      <button onclick="window._configTab='contas';renderView()" style="padding:8px 20px;border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:all .2s;${window._configTab==='contas'?'background:#283c78;color:#fff;':'background:transparent;color:#4a6080;'}">
        📒 Contas a Débito</button>
      <button onclick="window._configTab='ccus';renderView()" style="padding:8px 20px;border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:all .2s;${window._configTab==='ccus'?'background:#283c78;color:#fff;':'background:transparent;color:#4a6080;'}">
        🏢 Centros de Custo</button>
    </div>

    ${window._configTab==='contas' ? renderConfigContas() : renderConfigCcus()}
  </div>`;
}

// ── CONTAS A DÉBITO ──────────────────────────────────────────────────────────
function renderConfigContas() {
  const rows = CONTAS_DEBITO.map((c,i) => `
    <tr class="tr-hover">
      <td class="mono" style="font-size:13px;color:#283c78;font-weight:600;">${c.conta}</td>
      <td style="font-size:13px;">${c.desc}</td>
      <td style="text-align:right;">
        <button class="btn-ghost btn-sm" onclick="editarConta(${i})">Editar</button>
        <button class="btn-danger btn-sm" style="margin-left:4px;" onclick="excluirConta(${i})">✕</button>
      </td>
    </tr>`).join("");

  return `
    <div class="card" style="padding:24px;margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div><div class="section-title" style="margin-bottom:0;">Contas a Débito de Depreciação</div>
        <div style="font-size:12px;color:#6080a0;margin-top:2px;">${CONTAS_DEBITO.length} conta(s) cadastrada(s)</div></div>
        <button class="btn-primary" onclick="abrirModalConta(null)">+ Nova Conta</button>
      </div>
      <div style="overflow:auto;">
        <table>
          <thead><tr><th style="width:160px;">Conta</th><th>Descrição</th><th style="width:120px;"></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

function abrirModalConta(idx) {
  const c = idx!==null ? CONTAS_DEBITO[idx] : {conta:"",desc:""};
  document.getElementById("modalConfigContent").innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <h3 style="font-size:17px;font-weight:700;">${idx!==null?'Editar Conta':'Nova Conta a Débito'}</h3>
      <button class="btn-ghost" onclick="fecharModalConfig()">✕</button>
    </div>
    <div style="margin-bottom:14px;">
      <label class="label">Código da Conta</label>
      <input class="input" id="cfg_conta" value="${c.conta}" placeholder="Ex: 5.1.1.19.0012" style="font-family:'DM Mono',monospace;"/>
    </div>
    <div style="margin-bottom:20px;">
      <label class="label">Descrição</label>
      <input class="input" id="cfg_contaDesc" value="${c.desc}" placeholder="Ex: DEPRECIAÇÃO DE FERRAMENTAS"/>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn-primary" onclick="salvarConta(${idx})">💾 Salvar</button>
      <button class="btn-ghost" onclick="fecharModalConfig()">Cancelar</button>
    </div>`;
  document.getElementById("modalConfig").style.display="flex";
}

function salvarConta(idx) {
  const conta = document.getElementById("cfg_conta").value.trim();
  const desc  = document.getElementById("cfg_contaDesc").value.trim();
  if(!conta||!desc){ toast("Preencha o código e a descrição.",false); return; }
  if(idx!==null) CONTAS_DEBITO[idx] = {conta,desc};
  else CONTAS_DEBITO.push({conta,desc});
  salvarContas();
  fecharModalConfig();
  toast("✓ Conta salva!");
  renderView();
}

function editarConta(idx) { abrirModalConta(idx); }

function excluirConta(idx) {
  if(!confirm("Excluir esta conta?")) return;
  CONTAS_DEBITO.splice(idx,1);
  salvarContas();
  toast("Conta excluída.");
  renderView();
}

// ── CENTROS DE CUSTO ─────────────────────────────────────────────────────────
function renderConfigCcus() {
  const rows = CENTROS_CUSTO.map((c,i) => `
    <tr class="tr-hover">
      <td class="mono" style="font-size:13px;color:#283c78;font-weight:600;">${c.ccus}</td>
      <td style="font-size:13px;">${c.desc}</td>
      <td style="text-align:right;">
        <button class="btn-ghost btn-sm" onclick="editarCcus(${i})">Editar</button>
        <button class="btn-danger btn-sm" style="margin-left:4px;" onclick="excluirCcus(${i})">✕</button>
      </td>
    </tr>`).join("");

  return `
    <div class="card" style="padding:24px;margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <div><div class="section-title" style="margin-bottom:0;">Centros de Custo</div>
        <div style="font-size:12px;color:#6080a0;margin-top:2px;">${CENTROS_CUSTO.length} centro(s) cadastrado(s)</div></div>
        <button class="btn-primary" onclick="abrirModalCcus(null)">+ Novo CCUS</button>
      </div>
      <div style="overflow:auto;">
        <table>
          <thead><tr><th style="width:140px;">Código</th><th>Descrição</th><th style="width:120px;"></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

function abrirModalCcus(idx) {
  const c = idx!==null ? CENTROS_CUSTO[idx] : {ccus:"",desc:""};
  document.getElementById("modalConfigContent").innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
      <h3 style="font-size:17px;font-weight:700;">${idx!==null?'Editar Centro de Custo':'Novo Centro de Custo'}</h3>
      <button class="btn-ghost" onclick="fecharModalConfig()">✕</button>
    </div>
    <div style="margin-bottom:14px;">
      <label class="label">Código do CCUS</label>
      <input class="input" id="cfg_ccus" value="${c.ccus}" placeholder="Ex: 1.020.999" style="font-family:'DM Mono',monospace;"/>
    </div>
    <div style="margin-bottom:20px;">
      <label class="label">Descrição</label>
      <input class="input" id="cfg_ccusDesc" value="${c.desc}" placeholder="Ex: OBRA NOVA EXPANSÃO"/>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn-primary" onclick="salvarCcus(${idx})">💾 Salvar</button>
      <button class="btn-ghost" onclick="fecharModalConfig()">Cancelar</button>
    </div>`;
  document.getElementById("modalConfig").style.display="flex";
}

function salvarCcus(idx) {
  const ccus = document.getElementById("cfg_ccus").value.trim();
  const desc = document.getElementById("cfg_ccusDesc").value.trim();
  if(!ccus||!desc){ toast("Preencha o código e a descrição.",false); return; }
  if(idx!==null) CENTROS_CUSTO[idx] = {ccus,desc};
  else CENTROS_CUSTO.push({ccus,desc});
  salvarCcus_local();
  fecharModalConfig();
  toast("✓ Centro de custo salvo!");
  renderView();
}

function salvarCcus_local() { localStorage.setItem("ccus_gest", JSON.stringify(CENTROS_CUSTO)); }

function editarCcus(idx) { abrirModalCcus(idx); }

function excluirCcus(idx) {
  if(!confirm("Excluir este centro de custo?")) return;
  CENTROS_CUSTO.splice(idx,1);
  salvarCcus_local();
  toast("Centro de custo excluído.");
  renderView();
}

function fecharModalConfig() { document.getElementById("modalConfig").style.display="none"; }
